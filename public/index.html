<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO3 Desktop</title>
  <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
          height: 100%; width: 100%;
          margin: 0; padding: 0;
          overflow: hidden;
          background-color: #000;
      }
      #app-root {
          height: 100%; width: 100%;
          display: flex; flex-direction: column;
      }
      #app-root > div {
          flex: 1; display: flex; flex-direction: column;
          height: 100%; width: 100%;
      }
      #app-root > div > div {
          flex: 1; display: flex; flex-direction: column;
          height: 100%; width: 100%;
      }
      #app-root > div > div > div > div {
          flex: 1; display: flex; flex-direction: column;
          height: 100%; width: 100%;
      }
      #app-root > div > div > div > div > div {
          flex: 1; display: flex; flex-direction: column;
          height: 100%; width: 100%;
      }
      /* react-native-vector-icons font faces */
      @font-face { src: url('fonts/MaterialIcons.ttf'); font-family: "MaterialIcons"; }
      @font-face { src: url('fonts/MaterialCommunityIcons.ttf'); font-family: "MaterialCommunityIcons"; }
      @font-face { src: url('fonts/FontAwesome.ttf'); font-family: "FontAwesome"; }
      @font-face { src: url('fonts/FontAwesome5_Regular.ttf'); font-family: "FontAwesome5Free-Regular"; }
      @font-face { src: url('fonts/FontAwesome5_Solid.ttf'); font-family: "FontAwesome5Free-Solid"; }
      @font-face { src: url('fonts/FontAwesome5_Brands.ttf'); font-family: "FontAwesome5Brands-Regular"; }
      @font-face { src: url('fonts/Ionicons.ttf'); font-family: "Ionicons"; }
      @font-face { src: url('fonts/Feather.ttf'); font-family: "Feather"; }
      @font-face { src: url('fonts/AntDesign.ttf'); font-family: "AntDesign"; }
      @font-face { src: url('fonts/Entypo.ttf'); font-family: "Entypo"; }
  </style>
</head>
<body>
<div id="app-root"></div>
<script src="bundle.web.js"></script>
</body>
</html>
