name: Manual Release with Custom Tag
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag name (e.g., B1.2.3 or V1.0.0)'
        required: true
        type: string

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format (optional)
        run: |
          if [[ ! "${{ github.event.inputs.version_tag }}" =~ ^[BV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "⚠️ Tag should start with B or V followed by semver (e.g., B1.2.3, V2.0.0)"
            echo "Continuing anyway..."
          fi

      - name: Compute versionCode (total number of releases)
        id: version
        run: |
          # Count all tags that start with B or V (your release tags)
          RELEASE_COUNT=$(git tag --list 'B*' --list 'V*' | wc -l)
          # New versionCode = previous max + 1
          VERSION_CODE=$((RELEASE_COUNT + 1))
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "📦 Tag: ${{ github.event.inputs.version_tag }} | versionCode: $VERSION_CODE"

      - name: Update JS version constant
        run: |
          sed -i "s/export const co3Version = \"[^\"]*\"/export const co3Version = \"${{ steps.version.outputs.tag }}\"/" main/constant.js
          echo "✅ Updated JS version constant to ${{ steps.version.outputs.tag }}"

      - name: Update build.gradle
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.versionCode }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.tag }}\"/" android/app/build.gradle
          echo "✅ Updated:"
          grep "versionCode\|versionName" android/app/build.gradle

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin main
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub App token
        id: bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Trigger iOS build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ steps.bot_token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'

      - name: Trigger Android build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ steps.bot_token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'