name: "Build iOS IPA (Unsigned)"

on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the IPA to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}  # checkout the tag

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate codegen artifacts
        run: npx react-native codegen --platform ios --outputPath .

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: bundle exec pod install
        env:
          RCT_NEW_ARCH_ENABLED: 1
        working-directory: ./ios

      - name: Archive app (unsigned release)
        run: |
          xcodebuild archive \
            -workspace CO3.xcworkspace \
            -scheme CO3 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CO3.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        working-directory: ./ios

      - name: Package .app into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CO3.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          echo "Packaging: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/CO3.ipa" Payload/

      - name: Rename artefact
        run: mv CO3.ipa CO3-IOS.ipa

      - name: Upload IPA artifact (for workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-IOS.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-IOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}